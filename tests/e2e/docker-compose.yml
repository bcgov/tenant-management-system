services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: $POSTGRES_DATABASE
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_USER: $POSTGRES_USER
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    image: ${FRONTEND_IMAGE}
    user: "1000"
    environment:
      BACKEND_URL: $BACKEND_URL
      LOGIN_PROXY_CLIENT_ID: $LOGIN_PROXY_CLIENT_ID
      LOGIN_PROXY_HOST_NAME: $LOGIN_PROXY_HOST_NAME
      LOG_LEVEL: $LOG_LEVEL
    ports:
      - "3000:3000" # <--- EXPOSES TO HOST. Maps localhost:3000 to container:3000
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    image: ${BACKEND_IMAGE}
    environment:
      ALLOWED_ORIGINS: $ALLOWED_ORIGINS
      BCGOV_SSO_API_URL: $BCGOV_SSO_API_URL
      BCGOV_SSO_API_URL_BCEID: $BCGOV_SSO_API_URL_BCEID
      BCGOV_SSO_API_CLIENT_ID: $BCGOV_SSO_API_CLIENT_ID
      BCGOV_SSO_API_CLIENT_SECRET: $BCGOV_SSO_API_CLIENT_SECRET
      BCGOV_TOKEN_URL: $BCGOV_TOKEN_URL
      ISSUER: $ISSUER
      JWKS_URI: $JWKS_URI
      NODE_ENV: $NODE_ENV
      PORT: $PORT
      TMS_AUDIENCE: $TMS_AUDIENCE
      LOG_LEVEL: $LOG_LEVEL
      CHES_API_URL: $CHES_API_URL
      CHES_CLEINT_ID: $CHES_CLIENT_ID
      CHES_CLIENT_SECRET: $CHES_CLIENT_SECRET
      ADMIN_NOTIFICATION_EMAIL: $ADMIN_NOTIFICATION_EMAIL
      APP_BASE_URL: $APP_BASE_URL
      PGBOUNCER_URL: $PGBOUNCER_URL
      POSTGRES_DATABASE: $POSTGRES_DATABASE
      POSTGRES_HOST: $POSTGRES_HOST
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_USER: $POSTGRES_USER
    depends_on:
      postgres:
        condition: service_healthy

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - '8082:8080'
    volumes:
      - ./cstar-e2e-realm.json:/opt/keycloak/data/import/standard-realm.json:ro
    restart: unless-stopped

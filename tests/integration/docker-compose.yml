      interval: 5s
      retries: 5
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--spider',
          '--tries=1',
          'http://localhost:7001/v1/health',
        ]
      timeout: 5s
    image: ghcr.io/bcgov/tenant-management-system/backend:${IMAGE_TAG}
    ports:
      - '7001:7001'

  db:
    environment:
      POSTGRES_DB: tmsdb
      POSTGRES_PASSWORD: testsecretpassword
      POSTGRES_USER: tms
    healthcheck:
      interval: 5s
      retries: 5
      test: ['CMD-SHELL', 'pg_isready -U tms']
      timeout: 5s
    image: postgres:17.7
    ports:
      - '7003:5432'
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d

  mock-jwks:
    build:
      context: ./mock-jwks
    healthcheck:
      interval: 5s
      retries: 5
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--spider',
          '--tries=1',
          'http://localhost:7002/certs',
        ]
      timeout: 5s
    ports:
      - '7002:7002'

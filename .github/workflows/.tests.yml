name: .Tests

on:
  workflow_call:
    inputs:
      prefix:
        description: Prefix of Endpoint
        default: dev.connect
        type: string
      domain:
        description: Domain of endpoint
        default: digital.gov.bc.ca
        type: string
      ### Required
      image_tag:
        description: Image tag for containerized integration tests
        required: true
        type: string
      target:
        description: PR number, dev, test or prod
        default: ${{ github.event.number }}-frontend
        type: string
    secrets:
      Username:
        required: true
      Password:
        required: true
      MFA_CODE:
        required: true

env:
  DOMAIN: ${{ inputs.domain }}
  PREFIX: ${{ inputs.prefix }}

permissions: {}

jobs:
  integration-tests:
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    name: Integration
    permissions:
      checks: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-cache-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-node-modules-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Generate assertion keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
          openssl rsa -in private.pem -pubout -out public.pem
          echo "ASSERTION_PRIVATE_KEY=$(perl -pe 's/\r?\n/\x5cn/' private.pem)" >> $GITHUB_ENV
          echo "ASSERTION_PUBLIC_KEY=$(perl -pe 's/\r?\n/\x5cn/' public.pem)" >> $GITHUB_ENV
          rm private.pem public.pem

      - name: Start test services
        run: docker compose -f docker-compose.yml up -d --quiet-pull --wait
        working-directory: tests/integration

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs
        working-directory: tests/integration

      - name: Run tests
        run: |
          npm ci --ignore-scripts
          npm run test:ci
        working-directory: tests/integration

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs
        working-directory: tests/integration

      - name: Stop test services
        if: always()
        run: |
          docker compose -f docker-compose.yml down
        working-directory: tests/integration

      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Integration Tests
          path: tests/integration/collection/results.xml
          reporter: java-junit

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bruno-test-results
          path: tests/integration/collection/results.xml

  e2e-tests:
    name: E2E
    defaults:
      run:
        working-directory: tests/e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Setup Node
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Run Playwright tests
        run: ./node_modules/.bin/playwright test

        env:
          BASE_URL: https://${{ env.PREFIX }}.${{ env.DOMAIN }}/
          E2E_AUTH_MODE: idir
          E2E_IDIR_USERNAME: ${{ secrets.Username }}
          E2E_IDIR_PASSWORD: ${{ secrets.Password }}
          E2E_MFA_CODE: ${{ secrets.MFA_CODE }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright screenshots on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-screenshots
          path: tests/e2e/test-results
          retention-days: 7

  load-tests:
    name: Load
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1.5.0
        env:
          BACKEND_URL: https://${{ env.PREFIX }}.${{ env.DOMAIN }}/api
          FRONTEND_URL: https://${{ env.PREFIX }}.${{ env.DOMAIN }}
        with:
          path: ./tests/load/${{ matrix.name }}-test.js
          flags: --vus 1 --iterations 10

name: Github Timeout Trace

on:
  pull_request:
    types: [labeled, opened, reopened, synchronize]

concurrency:
  # Cancel in progress for PR open and close
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  curl_loop_test:
    name: Curl Loop Test
    environment:
      name: dev
    runs-on: ubuntu-24.04
    steps:
      - id: curl_loginproxy
        if: always()
        run: |
          while curl https://loginproxy.gov.bc.ca; do
            echo "curl succeeded, retrying..."
          done
      
  oc_api_loop_test:
    name: Oc API Loop Test
    environment:
      name: dev
    runs-on: ubuntu-24.04
    steps:
      - id: curl_oc_api
        if: always()
        run: |
          curl -skv \
          -H "Authorization: Bearer ${{ secrets.OC_TOKEN }}" \
          "${{ vars.OC_SERVER }}"

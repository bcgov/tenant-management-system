name: PR Closed

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Release target to uninstall.  expects pr or dev,test,prod,etc'
        required: true
        type: string
      force_cleanup:
        description: 'Force database cleanup.  Sometimes we want to keep the db'
        required: false
        type: string
        default: true
  workflow_call:
    inputs:
      target:
        description: 'Release target to uninstall.  expects pr or dev,test,prod,etc'
        required: true
        type: string
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: ${{ github.event.number || inputs.target }}
  cancel-in-progress: true

permissions: {}

jobs:
  remove-staging-dev:
    name: Remove App + Database 
    environment: staging-dev
    runs-on: ubuntu-24.04
    env:
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
      oc_server: ${{ vars.OC_SERVER }}
    steps:
      - name: Helm Uninstall
        run: |
          helm uninstall ${{ github.event.number || inputs.target }}

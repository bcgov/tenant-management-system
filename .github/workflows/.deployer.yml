name: .Helm Deployer

on:
  workflow_call:
    inputs:
      ### Required
      # Only secrets!

      ### Typical / recommended
      atomic:
        description: Atomic deployment?  That means fail all or nothing
        default: false
        required: false
        type: boolean
      directory:
        description: Chart directory
        default: 'charts/app'
        required: false
        type: string
      environment:
        description: Environment name; omit for PRs
        required: false
        type: string
      oc_server:
        default: https://api.gold.devops.gov.bc.ca:6443
        description: OpenShift server
        required: false
        type: string
      params:
        description: Extra parameters to pass to helm upgrade
        required: false
        type: string
      tag:
        description: Specify a tag to deploy; defaults to PR number
        required: false
        type: string
      digests:
        description: Optional JSON map of per-package image digests from image-tracker
        required: false
        type: string
        default: ''
      triggers:
        description: Paths used to trigger a deployment; e.g. ('./backend/' './frontend/')
        required: false
        type: string
      db_user:
        description: The database user
        required: false
        default: 'app'
        type: string
      debug:
        description: Debug mode
        default: false
        required: false
        type: boolean
      db_triggers:
        description: Paths used to trigger a database deployment; e.g. ('charts/crunchy/')
        required: false
        type: string

      ### Usually a bad idea / not recommended
      release_name:
        description: 'Release name to use if defined'
        required: false
        type: string
      crunchy_release_name:
        default: cstar-db
        description: 'Release name to use if defined'
        required: false
        type: string
      timeout-minutes:
        description: 'Timeout minutes'
        default: 10
        required: false
        type: number
      values:
        description: 'Values file'
        default: 'values.yaml'
        required: false
        type: string
    outputs:
      tag:
        description: 'Which tag was used for deployment?'
        value: ${{ jobs.deploy.outputs.tag }}
      triggered:
        description: 'Has a deployment has been triggered?'
        value: ${{ jobs.deploy.outputs.triggered }}

jobs:
  deploy:
    name: Stack
    environment:
      name: ${{ inputs.environment || 'dev' }}
      url: 'https://${{ steps.vars.outputs.release }}.${{ steps.vars.outputs.domain }}'
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ inputs.tag || steps.pr.outputs.pr }}
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/action-crunchy@e6448470ae0290ff5ce9ee5ce9bf4aef4dba8610
        name: Deploy Crunchy
        id: deploy_crunchy
        with:
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_server: ${{ vars.OC_SERVER }}
          release_name: ${{ inputs.crunchy_release_name }}
          environment: ${{ inputs.environment }}
          values_file: charts/crunchy/values-${{ inputs.environment || 'dev' }}.yml
          triggers: ${{ inputs.db_triggers }}
          s3_access_key: ${{ secrets.s3_access_key }}
          s3_secret_key: ${{ secrets.s3_secret_key }}
          s3_bucket: ${{ secrets.s3_bucket }}
          s3_endpoint: ${{ secrets.s3_endpoint }}

      # Variables
      - if: inputs.tag == '' && inputs.digests == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
      - if: inputs.tag == '' && inputs.digests == ''
        id: pr
        uses: bcgov/actions/image-tracker@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          max_depth: 100
          packages: |
            migrations
            backend
            frontend

      - id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DIGESTS: ${{ inputs.digests }}
          TRACKED_DIGESTS: ${{ steps.pr.outputs.digests }}
          TRACKED_PR: ${{ steps.pr.outputs.pr }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          RUN_NUMBER: ${{ github.run_number }}
          OC_SERVER: ${{ vars.OC_SERVER }}
        run: |
          # Vars: tag, digests, and release
          digests_json="${INPUT_DIGESTS:-${TRACKED_DIGESTS}}"
          migrations_digest=""
          backend_digest=""
          frontend_digest=""
          if [ -n "${digests_json}" ]; then
            migrations_digest=$(printf '%s' "${digests_json}" | jq -r '.migrations // empty')
            backend_digest=$(printf '%s' "${digests_json}" | jq -r '.backend // empty')
            frontend_digest=$(printf '%s' "${digests_json}" | jq -r '.frontend // empty')
            if [ -z "${migrations_digest}" ] || [ -z "${backend_digest}" ] || [ -z "${frontend_digest}" ]; then
              echo "::error::digests JSON must include migrations, backend, and frontend: ${digests_json}"
              exit 1
            fi
            tag=""
          else
            tag="${INPUT_TAG:-${TRACKED_PR}}"
          fi

          if [ -n "${INPUT_RELEASE_NAME}" ]; then
            release="${INPUT_RELEASE_NAME}"
          else
            release="cstar-${INPUT_ENV:-${tag}}"
          fi

          # Version, to support helm packaging for non-pr based releases (workflow_dispatch). default to 1.0.0+github run number
          version="1.0.0+${RUN_NUMBER}"

          # Extract domain name for github host url
          domain=$(echo "${OC_SERVER}" | sed -E 's#https?://##; s#:[0-9]+##; s#^api\.#apps.#')

          # Summary
          echo "tag=${tag}"
          echo "migrations_digest=${migrations_digest}"
          echo "backend_digest=${backend_digest}"
          echo "frontend_digest=${frontend_digest}"
          echo "release=${release}"
          echo "version=${version}"
          echo "domain=${domain}"

          # Output
          {
            echo "tag=${tag}"
            echo "migrations_digest=${migrations_digest}"
            echo "backend_digest=${backend_digest}"
            echo "frontend_digest=${frontend_digest}"
            echo "release=${release}"
            echo "version=${version}"
            echo "domain=${domain}"
          } >> "$GITHUB_OUTPUT"

      - name: Stop pre-existing deployments on PRs (status = pending-upgrade)
        if: github.event_name == 'pull_request'
        uses: bcgov/actions-openshift/oc-runner@4ad9f97c20e0e00454bfd35e54537ee8622fa166 # v0.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.oc_server }}
          triggers: ${{ inputs.triggers }}
          commands: |
            # Interrupt any previous deployments (PR only)
            PREVIOUS=$(helm status ${{ steps.vars.outputs.release }} -o json | jq .info.status || true)
            if [[ ${PREVIOUS} =~ pending ]]; then
              echo "Rollback triggered"
              helm rollback ${{ steps.vars.outputs.release }} || \
                helm uninstall ${{ steps.vars.outputs.release }}
            fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Debug Values File
        if: inputs.debug == 'true'
        run: ls -l charts/crunchy/values.yml

      - name: Helm Deploy
        id: deploy
        uses: bcgov/actions-openshift/oc-runner@4ad9f97c20e0e00454bfd35e54537ee8622fa166 # v0.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.oc_server }}
          triggers: ${{ inputs.triggers }}
          ref: ${{ github.ref }}
          commands: |
            # Deploy

            # If directory provided, cd to it
            [ -z "${{ inputs.directory }}" ]|| cd ${{ inputs.directory }}

            # Helm package
            sed -i 's/^name:.*/name: ${{ github.event.repository.name }}/' Chart.yaml
            helm package -u . --app-version="tag-${{ steps.vars.outputs.tag || 'digest' }}_run-${{ github.run_number }}" --version=${{ steps.vars.outputs.version }}
            DIGEST_ARGS=()
            [ -z "${{ steps.vars.outputs.migrations_digest }}" ] || DIGEST_ARGS+=(--set-string "global.digests.migrations=${{ steps.vars.outputs.migrations_digest }}")
            [ -z "${{ steps.vars.outputs.backend_digest }}" ] || DIGEST_ARGS+=(--set-string "global.digests.backend=${{ steps.vars.outputs.backend_digest }}")
            [ -z "${{ steps.vars.outputs.frontend_digest }}" ] || DIGEST_ARGS+=(--set-string "global.digests.frontend=${{ steps.vars.outputs.frontend_digest }}")
            # print the values.yaml file to see the values being used
            # Helm upgrade/rollout
            helm upgrade \
              --set-string backend.assertionExpiresInSeconds=${{ vars.ASSERTION_EXPIRES_IN_SECONDS || '300' }} \
              --set-string backend.assertionIssuer=${{ vars.ASSERTION_ISSUER }} \
              --set-string backend.assertionKeyId=${{ vars.ASSERTION_KEY_ID }} \
              --set-string backend.assertionPublicKey="${{ vars.ASSERTION_PUBLIC_KEY }}" \
              --set-string backend.assertionPrivateKey="${{ secrets.ASSERTION_PRIVATE_KEY }}" \
              --set-string backend.tmsAudience=${{ vars.tms_audience }} \
              --set-string backend.bcgovSsoApiClientId=${{ secrets.bcgov_sso_api_client_id }} \
              --set-string backend.bcgovSsoApiClientSecret=${{ secrets.bcgov_sso_api_client_secret }} \
              --set-string backend.chesClientId=${{ secrets.CHES_CLIENT_ID }} \
              --set-string backend.chesClientSecret=${{ secrets.CHES_CLIENT_SECRET }} \
              --set-string backend.bcgovSsoApiUrl=${{ vars.BCGOV_SSO_API_URL }} \
              --set-string backend.bcgovSsoApiUrlBceid=${{ vars.BCGOV_SSO_API_URL_BCEID }} \
              --set-string backend.bcgovTokenUrl=${{ vars.BCGOV_TOKEN_URL }} \
              --set-string backend.chesTokenUrl=${{ vars.CHES_TOKEN_URL }} \
              --set-string backend.chesApiUrl=${{ vars.CHES_API_URL }} \
              --set-string backend.adminNotificationEmail=${{ vars.ADMIN_NOTIFICATION_EMAIL }} \
              --set-string backend.appBaseUrl=${{ vars.APP_BASE_URL }} \
              --set-string frontend.link.contactUs=${{ vars.LINK_CONTACT_US }} \
              --set-string frontend.link.documentation=${{ vars.LINK_DOCUMENTATION }} \
              --set-string frontend.link.notify=${{ vars.LINK_NOTIFY }} \
              --set-string frontend.link.submit=${{ vars.LINK_SUBMIT }} \
              --set-string frontend.link.workflow=${{ vars.LINK_WORKFLOW }} \
              --set-string global.repository=${{ github.repository }} \
              --set-string global.tag=${{ steps.vars.outputs.tag }} \
              ${DIGEST_ARGS[@]+"${DIGEST_ARGS[@]}"} \
              --set-string global.config.databaseUser=${{ inputs.db_user }} \
              --set-string global.databaseAlias=${{ steps.deploy_crunchy.outputs.release }}-crunchy \
              --set-string global.loginProxy.clientId=${{ vars.LOGIN_PROXY_CLIENT_ID }} \
              --set-string global.loginProxy.hostName=${{ vars.LOGIN_PROXY_HOST_NAME }} \
              --set-string global.env.logLevel=${{ vars.LOG_LEVEL }} \
              ${{ inputs.params }} \
              --install --wait ${{ inputs.atomic && '--atomic' || '' }} ${{ steps.vars.outputs.release }} \
              --timeout ${{ inputs.timeout-minutes }}m \
              --values ${{ inputs.values }} \
              ./${{ github.event.repository.name }}-${{ steps.vars.outputs.version }}.tgz

            # Helm release history
            helm history ${{ steps.vars.outputs.release }}

            # Completed pod cleanup
            oc delete po --field-selector=status.phase==Succeeded || true

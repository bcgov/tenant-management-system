name: PR

on:
  pull_request:
    types: [labeled, opened, reopened, synchronize]

concurrency:
  # Cancel in progress for PR open and close
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Changes
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    outputs:
      triggered: ${{ steps.diff.outputs.triggered }}
    steps:
      - id: diff
        uses: bcgov/actions/diff-triggers@acc058abf85bb183dad21b839a92a40a4ff47af3 # v0.14.0
        with:
          triggers: |
            backend/
            frontend/
            migrations/
            charts/
            tests/
            .github/workflows/pr-open.yml
            .github/workflows/gold-dev.yml
            .github/workflows/.deployer.yml
            .github/workflows/.tests.yml

  builds:
    name: Builds
    permissions:
      attestations: write
      id-token: write
      packages: write
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        package: [backend, frontend, migrations]
    timeout-minutes: 10
    steps:
      - uses: bcgov/actions/builder@acc058abf85bb183dad21b839a92a40a4ff47af3 # v0.14.0
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: |
            '${{ matrix.package }}/'

  deploys-gold-dev:
    name: Deploys (${{ github.event.number }})
    needs: [changes, builds]
    if: needs.changes.outputs.triggered == 'true'
    uses: ./.github/workflows/gold-dev.yml
    secrets: inherit
    with:
      dr_enabled: false
      release_name: cstar-${{ github.event.number }}
      tag: ${{ github.event.number }}
      db_user: app-${{ github.event.number }}
      params: --set global.secrets.persist=false
        --set frontend.ingress.tls=""

  tests:
    name: Tests
    needs: [deploys-gold-dev]
    permissions:
      checks: write
    uses: ./.github/workflows/.tests.yml
    with:
      prefix: cstar-${{ github.event.number }}-frontend
      domain: apps.gold.devops.gov.bc.ca
      image_tag: ${{ github.event.number }}
    secrets:
      Username: ${{ secrets.E2E_IDIR_USERNAME }}
      Password: ${{ secrets.E2E_IDIR_PASSWORD }}
      MFA_CODE: ${{ secrets.E2E_MFA_CODE }}

  zap:
    name: ZAP Security Scan
    needs: [deploys-gold-dev]
    if: |
      contains(github.event.pull_request.labels.*.name, 'zap') &&
      needs.deploys-gold-dev.outputs.triggered == 'true'
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        name: [backend, frontend]
        include:
          - name: backend
            path: api
          - name: frontend
            path: ''
    steps:
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          allow_issue_writing: false
          artifact_name: zap-${{ matrix.name }}-pr${{ github.event.number }}
          target: https://cstar-${{ github.event.number }}-frontend.apps.gold.devops.gov.bc.ca/${{ matrix.path }}
          token: ${{ secrets.GITHUB_TOKEN }}

  results:
    name: PR Results
    needs: [changes, builds, deploys-gold-dev, tests, zap]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - if: contains(needs.*.result, 'failure')||contains(needs.*.result, 'canceled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"

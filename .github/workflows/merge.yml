name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag set to deploy; e.g. PR number or prod'
        type: string
        default: 'prod'

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  vars:
    name: Set Variables
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      # Get PR number for squash merges to main
      - name: Get PR Number From Event
        if: github.event_name == 'push'
        id: pr_no
        uses: bcgov/action-get-pr@bfa713a9ab410c0f0c13126c35983934fc80d15b # v0.1.1
      - name: PR Number
        id: pr
        run: echo pr=${{ steps.pr_no.outputs.pr || inputs.pr}} >> $GITHUB_OUTPUT

  deploys-gold-dev:
    name: Deploys Gold Dev - (${{ needs.vars.outputs.pr }})
    needs: [vars]
    uses: ./.github/workflows/gold-dev.yml
    secrets: inherit
    with:
      dr_enabled: true
      release_name: cstar-dev
      tag: ${{ needs.vars.outputs.pr }}
      db_user: appproxy
      params: --set frontend.ingress.hosts[0].host=dev.connect.digital.gov.bc.ca

  promote-dev:
    name: Promote Images
    needs: [vars, deploys-gold-dev]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [migrations, backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5.0.0
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.vars.outputs.pr }}
          tags: dev


  deploys-gold-test:
    name: Deploys Gold Test - (${{ needs.vars.outputs.pr }})
    needs: [vars, promote-dev]
    uses: ./.github/workflows/gold-test.yml
    secrets: inherit
    with:
      release_name: cstar-test
      tag: ${{ needs.vars.outputs.pr }}
      db_user: appproxy
      params: --set frontend.ingress.hosts[0].host=test.connect.digital.gov.bc.ca

  promote-test:
    name: Promote Images
    needs: [vars, deploys-gold-test]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [migrations, backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5.0.0
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.vars.outputs.pr }}
          tags: test


  deploys-gold-prod:
    name: Deploys Gold Prod - (${{ needs.vars.outputs.pr }})
    needs: [vars, promote-test]
    uses: ./.github/workflows/gold-prod.yml
    secrets: inherit
    with:
      release_name: cstar-prod
      tag: ${{ needs.vars.outputs.pr }}
      db_user: appproxy
      params: --set frontend.ingress.hosts[0].host=connect.digital.gov.bc.ca

  promote-prod:
    name: Promote Images Prod
    needs: [vars, deploys-gold-prod]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [migrations, backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5.0.0
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.vars.outputs.pr }}
          tags: prod

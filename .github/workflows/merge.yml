name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag set to deploy; e.g. PR number or prod'
        type: string
        default: 'prod'

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  vars:
    name: Set Variables
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      # Resolve and tag each package's built digest with the merge SHA
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
      - name: Tag Resolved Images
        if: github.event_name == 'push'
        uses: bcgov/actions/image-tracker@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          max_depth: 100
          packages: |
            migrations
            backend
            frontend
          tags: |
            ${{ github.sha }}
            latest

      - name: Deploy Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

  deploys-gold-dev:
    name: Deploys Gold Dev - (${{ needs.vars.outputs.tag }})
    needs: [vars]
    uses: ./.github/workflows/gold-dev.yml
    secrets: inherit
    with:
      dr_enabled: true
      release_name: cstar-dev
      tag: ${{ needs.vars.outputs.tag }}
      db_user: appproxy
      params: --set frontend.ingress.hosts[0].host=dev.connect.digital.gov.bc.ca

  promote-dev:
    name: Promote Images
    needs: [vars, deploys-gold-dev]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [migrations, backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5.0.0
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.vars.outputs.tag }}
          tags: dev


  deploys-gold-test:
    name: Deploys Gold Test - (${{ needs.vars.outputs.tag }})
    needs: [vars, promote-dev]
    uses: ./.github/workflows/gold-test.yml
    secrets: inherit
    with:
      release_name: cstar-test
      tag: ${{ needs.vars.outputs.tag }}
      db_user: appproxy
      params: --set frontend.ingress.hosts[0].host=test.connect.digital.gov.bc.ca

  promote-test:
    name: Promote Images
    needs: [vars, deploys-gold-test]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [migrations, backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5.0.0
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.vars.outputs.tag }}
          tags: test


  deploys-gold-prod:
    name: Deploys Gold Prod - (${{ needs.vars.outputs.tag }})
    needs: [vars, promote-test]
    uses: ./.github/workflows/gold-prod.yml
    secrets: inherit
    with:
      release_name: cstar-prod
      tag: ${{ needs.vars.outputs.tag }}
      db_user: appproxy
      params: --set frontend.ingress.hosts[0].host=connect.digital.gov.bc.ca

  promote-prod:
    name: Promote Images Prod
    needs: [vars, deploys-gold-prod]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [migrations, backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5.0.0
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.vars.outputs.tag }}
          tags: prod

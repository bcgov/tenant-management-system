name: PR Validate

on:
  pull_request:
    types: [edited, opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-edit-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    permissions:
      pull-requests: write
    runs-on: ubuntu-26.04

    steps:
      - name: Validate PR
        uses: bcgov/actions/pr-validate@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          markdown: |
            ---

            Thanks for the PR!

            Deployments, as required, will be available below:
            - [Frontend](https://cstar-${{ github.event.number }}.apps.gold.devops.gov.bc.ca)
            - [Backend](https://cstar-${{ github.event.number }}.apps.gold.devops.gov.bc.ca/api/v1)
            - [OpenAPI](https://cstar-${{ github.event.number }}.apps.gold.devops.gov.bc.ca/api/v1/docs)

            Please create PRs in draft mode. Mark as ready to enable:
            - [Analysis Workflow](https://github.com/bcgov/tenant-management-system/actions/workflows/analysis.yml)

            After merge, new images are deployed in:
            - [Merge Workflow](https://github.com/bcgov/tenant-management-system/actions/workflows/merge.yml)

  results:
    name: Validate Results
    if: always()
    needs: [validate]
    runs-on: ubuntu-26.04
    steps:
      - run: echo "Success!"

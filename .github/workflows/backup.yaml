name: Backup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Backup environment - dev/test/prod"
        required: true
        type: choice
        options: ["dev","test","prod"]
        default: "dev"

permissions: {}

jobs:
  backup:
    permissions:
      packages: write
    name: Backup
    environment:
      name: gold-${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Backup
        id: deploy
        uses: bcgov/actions-openshift/oc-runner@4ad9f97c20e0e00454bfd35e54537ee8622fa166 # v0.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.oc_server }}
          commands: |
            oc annotate postgrescluster cstar-db-crunchy --overwrite postgres-operator.crunchydata.com/pgbackrest-backup="$(date)"
